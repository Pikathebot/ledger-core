name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - name: Test and lint (same two commands as Greenline's sandbox)
        shell: bash {0}
        run: |
          pytest -q; ec1=$?
          ruff check .; ec2=$?
          [ $ec1 -eq 0 ] && [ $ec2 -eq 0 ]
